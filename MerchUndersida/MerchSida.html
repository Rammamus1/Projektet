<html>
<head>
<meta name="viewport" charset="utf-8" lang="En" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="MerchKlass.css">
<link rel="stylesheet" href="MerchBilagor">
</head>

<body>
<div class="background-container">
<div class="container">
<div> 
    <h1 class="unbold roboto_font">
    Shawn Mendes Store       
</h1> 
</div>
</div>

<h2>Recommended Apparel</h2>

<h3> View All </h3>

<button class="button1" onclick="toggleSort()">Toggle Sort by Price</button>

<div id="merch-display"> </div>

<script type = "text/javascript">
class Item
{
    // Klassen item används till varje sak som Shawn säljer i sin shop.
    constructor(price, shirt, hoodie, disc, link, image, name)
    {
        this.price = price;
        this.shirt = shirt;
        this.hoodie = hoodie;
        this.disc = disc;
        this.link = link;
        this.image = image;
        this.name = name;
    }
}

function createItems() {
    let merchList = [];
    merchList[0] = new Item(45.00, true, false, false, "https://shop.shawnmendesofficial.com/products/white-heart-tour-tee", "shirt 1.jpg", "WHITE HEART TOUR TEE");
    merchList[1] = new Item(70.00, false, true, false, "https://shop.shawnmendesofficial.com/products/w-hoodie-i", "hoodie 1.jpg", "W HOODIE I");
    merchList[2] = new Item(60.00, false, true, false, "https://shop.shawnmendesofficial.com/products/winter-floral-02-hoodie", "hoodie 2.jpg", "WINTER FLORAL 02 HOODIE");
    merchList[3] = new Item(5.00, false, false, true, "https://shop.shawnmendesofficial.com/collections/vintage-shop/products/if-i-can-t-have-you-cd-i", "cd 1.jpg", "If I Cant Have You CD I");
    merchList[4] = new Item(13.98, false, false, true, "https://shop.shawnmendesofficial.com/collections/vintage-shop/products/shawn-mendes-cd", "cd 2.jpg", "Shawn Mendes CD");
    merchList[5] = new Item(40.00, true, true, false, "https://shop.shawnmendesofficial.com/collections/longsleeves/products/the-tour-sketch-long-sleeve-t-shirt", "shirt 2.jpg", "THE TOUR SKETCH LONG SLEEVE T-SHIRT");
    merchList[6] = new Item(35.00, true, false, false, "https://shop.shawnmendesofficial.com/collections/t-shirts/products/the-tour-flower-t-shirt-i", "shirt 3.jpg", "THE TOUR FLOWER T-SHIRT I");
    merchList[7] = new Item(30.00, true, false, false, "https://shop.shawnmendesofficial.com/collections/t-shirts/products/monster-ledge-photo-t-shirt-screenprint-anniversary-edition", "shirt 4.jpg", "MONSTER LEDGE PHOTO T-SHIRT");
    return merchList;
} 

// Sortera med pris
function sortPrice(merchList) {
    merchList.sort(function(a, b) {
        return a.price - b.price;
    });
}

let originalList = createItems();
let merchList = [...originalList];
let sorted = false;

// toggleSort 
function toggleSort() {

    if (!sorted) {
        sortPrice(merchList);
    }
    else {
        merchList = [...originalList];
    }
    sorted = !sorted;
    printItems(merchList);
} 

function printItems(list)
{
    let displayArea = document.getElementById("merch-display");
    let imgContent = "<div class='merch-grid'>";

    for (let i = 0; i < list.length; i++)
    {
        imgContent += `
        <div class="merch-item">
        <a href="${list[i].link}">
                <img src="MerchBilagor/${list[i].image}" alt="${list[i].name}">
        </a>
            <p>${list[i].name}</p>
            <p>$${list[i].price}</p>

        </div>`;
    }

    imgContent += "</div>";
    displayArea.innerHTML = imgContent;
}


printItems(merchList);
</script> 


</body>
</html>
