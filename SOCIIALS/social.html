<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCIALS</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>SOCIALS</h1>

    <!-- Music platforms row -->
    <div class="music-row">
        <div class="music-item">
            <div class="icon-title">
                <i class="fa-brands fa-spotify"></i>
                <h2>Spotify</h2>
            </div>
            <a href="https://open.spotify.com/artist/7n2wHs1TKAczGzO7Dd2rGr" target="_blank">Visit Spotify</a>
        </div>

        <div class="music-item">
            <div class="icon-title">
                <i class="fa-brands fa-youtube"></i>
                <h2>YouTube</h2>
            </div>
            <a href="https://www.youtube.com/channel/UCAvCL8hyXjSUHKEGuUPr1BA" target="_blank">Visit YouTube</a>
        </div>

        <div class="music-item">
            <div class="icon-title">
                <i class="fa-brands fa-apple"></i>
                <h2>Apple Music</h2>
            </div>
            <a href="https://music.apple.com/us/artist/shawn-mendes/890403665" target="_blank">Visit Apple Music</a>
        </div>
    </div>

    <!-- Instagram and Email row -->
    <div class="music-row">
        <div class="music-item">
            <div class="icon-title">
                <i class="fa-brands fa-instagram"></i>
                <h2>Instagram</h2>
            </div>
            <a href="https://instagram.com/shawnmendes" target="_blank">Visit Instagram</a>
        </div>

        <div class="music-item">
            <div class="icon-title">
                <i class="fa-solid fa-envelope"></i>
                <h2>Email</h2>
            </div>
            <a href="mailto:shawnmendes@example.com" target="_blank">shawnmendes@example.com</a>
        </div>
    </div>

</body>
</html>
