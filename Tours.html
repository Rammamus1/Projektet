<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Tourdatum</title>
    <style>
       
        h1 {
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        input, button {
            padding: 8px;
            margin: 5px;
            font-size: 16px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .date {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>On The Road Again Tour</h1>

    <div class="controls">
        <label for="fromDate">Från datum:</label>
        <input type="date" id="fromDate">
        
        <label for="toDate">Till datum:</label>
        <input type="date" id="toDate">
        
        <button onclick="filterTours()">Filtrera</button>
        <button onclick="resetFilter()">Återställ</button>
    </div>

    <ul id="tourList"></ul>

    <script>
        const tours = [
            { date: "2026-03-10", city: "Stockholm", venue: "Avicii Arena" },
            { date: "2026-03-15", city: "x", venue: "x" },
            { date: "2026-04-01", city: "x", venue: "x x" },
            { date: "2026-05-20", city: "x", venue: "x" },
            { date: "2026-06-05", city: "x", venue: "x" }
        ];

        const tourList = document.getElementById("tourList");

        function renderTours(filteredTours) {
            tourList.innerHTML = "";
            filteredTours.forEach(tour => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <div class="date">${tour.date}</div>
                    <div>${tour.city}</div>
                    <div>${tour.venue}</div>
                `;
                tourList.appendChild(li);
            });
        }

        function filterTours() {
            const fromDate = document.getElementById("fromDate").value;
            const toDate = document.getElementById("toDate").value;

            let filtered = tours;

            if (fromDate) {
                filtered = filtered.filter(tour => tour.date >= fromDate);
            }
            if (toDate) {
                filtered = filtered.filter(tour => tour.date <= toDate);
            }

            renderTours(filtered);
        }

        function resetFilter() {
            document.getElementById("fromDate").value = "";
            document.getElementById("toDate").value = "";
            renderTours(tours);
        }

        // Visa alla tours vid start
        renderTours(tours);
    </script>

</body>
</html>
